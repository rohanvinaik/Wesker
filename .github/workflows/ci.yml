name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    # Matrix over the classifiers' claimed Pythons (3.10–3.13) and two OSes. Mutation runs use
    # in-process pytest sessions and subprocess isolation — the surface that varies across
    # versions/platforms — so a single ubuntu/one-Python job left the claims unverified.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        # --python overrides the repo .python-version pin so each cell resolves its own interpreter.
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check Wesker/ tests/

      - name: Format check
        run: uv run ruff format --check Wesker/ tests/

      - name: Test with coverage
        run: uv run pytest tests/ --cov=Wesker --cov-report=xml:coverage.xml -q

      - name: Upload coverage report
        # Only the canonical cell feeds SonarCloud — avoids a matrix artifact-name collision, and
        # coverage is platform/Python-independent so one cell suffices.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      # Skips (keeping CI green) until SONAR_TOKEN is set; activates the
      # Quality Gate + Coverage badges the moment the secret is added.
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
