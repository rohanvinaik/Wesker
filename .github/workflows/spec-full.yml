# THE BADGE RUN — whole codebase, uncompromised, measured as a matrix of file groups.
#
# Nothing waits on this. No human is watching a spinner and no merge is blocked, so it has no
# latency budget at all: it runs weekly and on every push to main, and writes an SVG to the
# `badges` branch (README.archive.md and docs/usage.md show how to serve it). On a public repo
# GitHub's standard runners are free, so even a long run costs nothing that matters.
#
# That is why it does NOT pass --allow-truncation. The one place a completeness measurement
# should refuse to compromise is the place with no deadline: a truncated run is a sample of
# whatever was cheap to reach, and a sample must never be badged as completeness. If this
# fails on a budget, raise the budget — do not lower the claim.
#
# WHY IT IS SHARDED (W#29, decision B1). One job over all the files took 146 minutes when it
# finished (43102482321 on fb2f8b4, engine.py alone 88 of them) and outran a 180-minute limit
# while still making progress when it did not (185985c). The project's law (Detective
# ARCHITECTURE section 11) is that the unit of measurement is one function, so anything that
# scales with the codebase is split, and a longer timeout is not the fix. The run is three kinds of job:
#
#   plan       resolves the targets EXACTLY as an unsharded run would (`python -m Wesker.action
#              --plan-shards N`), splits them into groups by source size (deterministic: same files,
#              same groups, on every machine), and emits the matrix.
#   measure    one job per group, `fail-fast: false`: the ordinary Action with `targets` set to
#              the group. Each shard pays the suite's baseline once, writes a record of what it was
#              asked to measure, the commit, the policy id and the Wesker version, and uploads it
#              (whatever its outcome) with its SARIF under its own code-scanning category.
#   aggregate  `needs: [plan, measure]`, `if: always()`: downloads every record and merges them
#              (`--merge`). Totals are SUMS of the shards' counts and the percentage is computed once
#              from them. The merge REFUSES, and publishes no number, when a planned shard did not
#              report, when shards disagree on commit, policy or version, when a file was measured
#              twice or the union is not the planned set, and when any shard ended in a refusal
#              (that shard's refusal is the run's). A refusal is never averaged into a number.
#              Only a merge that produced a number writes the badge.
#
# Shard count: 4 by default (`workflow_dispatch` can override it). The files are unequal: engine.py is
# 56% of the source bytes and 88 of the 146 minutes, so it is a shard of its own whatever N is, and the
# critical path is that shard. 4 puts it alone and splits the rest into three near-equal groups of about
# 20 minutes each; more shards would shorten nothing on the critical path and pay the whole-suite baseline
# trace once more per shard. The time has not been re-measured on the sharded shape: this workflow is
# unverified until it has run on GitHub.
#
# No latency budget is not no bound. `timeout-minutes` bounds LIVENESS, never the measurement
# (the per-function budget below is the measurement's bound): 150 minutes per shard is 1.7 times the
# slowest shard (engine.py's, 88 minutes plus its baseline). A run that stalls must end with
# evidence of where it stalled, so WESKER_STACK_DUMP_S dumps every thread's stack every 15 minutes
# to a private copy of stderr — every push of 2026-10-24 sat silent for six hours and left none.
# The dump runs on a clock of its own (a child process signalling SIGURG): pytest cancels
# faulthandler's own timer on every failing test, which silenced the first version of this (W#29).
# A newer push supersedes a running measurement of older code (`concurrency`).
#
# Actions are pinned to full commit SHAs (the release in the trailing comment): a tag can be moved
# to point at different code, a commit cannot.
name: Specification (full)

on:
  push:
    branches: [main]
  schedule:
    # Weekly. The badge is a property of the codebase, and the codebase does not change while
    # nobody pushes.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      shards:
        description: "How many file groups to measure in parallel (see the header for the default)"
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  group: spec-full-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ── plan ─────────────────────────────────────────────────────────
  plan:
    name: Plan the shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      # The plan resolves its targets with the same code an unsharded run uses, so the planned set is by
      # construction the set that run would measure. Wesker itself is all it needs to import.
      - name: Plan the matrix
        id: plan
        env:
          # Through env, never spliced into the script. A dispatch value is checked by the planner
          # (a non-number or < 1 is a named refusal), not by this shell.
          SHARDS: ${{ inputs.shards || '4' }}
        run: |
          python -m pip install .
          mkdir -p plan
          python -m Wesker.action --plan-shards "$SHARDS" --plan-out plan/plan.json > plan/matrix.json
          cat plan/matrix.json
          echo "matrix=$(cat plan/matrix.json)" >> "$GITHUB_OUTPUT"

      # The aggregation job verifies every shard against this plan.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wesker-plan
          path: plan/plan.json
          if-no-files-found: error

  # ── measure ──────────────────────────────────────────────────────
  measure:
    name: Measure shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    # Liveness, not the measurement: the slowest shard (engine.py) took 88 of the 146 minutes in one job.
    timeout-minutes: 150
    strategy:
      # One shard's refusal must not hide what the others found; the aggregation job reads them all.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      WESKER_STACK_DUMP_S: "900"
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Measure this shard
        id: spec
        # `./` rather than the newer `$/` self-repository form: switching changes how the action is
        # resolved at run time, which is a behaviour change to verify on a real run, not a lint fix.
        uses: ./ # zizmor: ignore[self-repository]
        with:
          # Raised 30000 → 120000 when policy 2–5 grew the universe (~+270
          # targets; engine.py alone is 4,330 mutants and two of its functions
          # outran 30s). Per the header: raise the budget, never the claim —
          # this run has no deadline, and 4× headroom means the next growth
          # spurt doesn't re-trip it immediately.
          budget: "120000"
          targets: ${{ matrix.targets }}
          shard: ${{ matrix.shard }}
          sarif: .wesker/wesker.sarif

      # Whatever the shard's outcome: a refusal is recorded under its name in the same file, and the
      # aggregation job turns a shard that reported nothing into a refusal of its own.
      - name: Upload this shard's record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: .wesker/shard_report.json
          include-hidden-files: true
          if-no-files-found: error

      # One category per shard: a single category would let each shard's upload replace the last.
      - name: Upload survivors as code-scanning alerts
        if: always() && hashFiles('.wesker/wesker.sarif') != ''
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: .wesker/wesker.sarif
          category: wesker-${{ matrix.artifact }}

  # ── aggregate ────────────────────────────────────────────────────
  aggregate:
    name: Specification completeness
    needs: [plan, measure]
    # Runs after a failed shard too: it must read that shard's recorded refusal, not be skipped by it.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The last step pushes the badge with this checkout's credentials, so they are kept on
          # purpose. No step uploads the working tree as an artifact.
          persist-credentials: true # zizmor: ignore[artipacked]

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install Wesker
        run: python -m pip install .

      - name: Download the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wesker-plan
          path: plan

      # One directory per shard artifact: reports/<artifact>/shard_report.json.
      - name: Download the shard records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-*
          path: reports

      # No number unless every planned shard reported, agrees, and measured. A failure here ends the job
      # before the badge: the README never shows a number Wesker does not stand behind.
      - name: Merge the shards
        id: spec
        run: |
          shopt -s nullglob
          python -m Wesker.action --merge --plan plan/plan.json reports/*/shard_report.json

      # ── The badge ────────────────────────────────────────────────
      #
      # ONE badge here: the whole-repo reading. Its pair is written by spec-pr.yml, which
      # measures the diff — two badges, one per workflow, because they answer different
      # questions on different clocks. Everything else this run knows lives in the step
      # summary, where it reads as conviction rather than advertising.
      #
      # There is no "unverified" badge, and that is deliberate: a run that cannot produce a
      # trustworthy number FAILS above, so no badge is written and the maintainer gets a red
      # X. The README never shows a number Wesker does not stand behind, and never shows an
      # apology either.
      - name: Create badges directory
        run: mkdir -p .github/badges

      # Colour is GREY below 80, not red. This measures something almost no suite scores well
      # on: `spec_pct` counts assertion kills alone, so a test that merely runs the code pins
      # nothing. A typical healthy repo lands well under 80% — Wesker's own ci.py reads 26%.
      # Painting that red would make the badge a verdict, and a verdict most projects fail is
      # not a measurement anyone installs twice. Grey reports; it does not scold. Green and
      # amber are kept for the genuinely rare cases where they mean something.
      - name: Specification completeness badge
        uses: emibcn/badge-action@4209421db54c8764d8932070ffd0f81715a629bf # v2.0.2
        with:
          label: "Specification"
          label-color: "333"
          status: "${{ steps.spec.outputs.spec-pct }}% of ${{ steps.spec.outputs.dimensions-total }} dimensions"
          color: ${{ steps.spec.outputs.spec-pct == '100' && '2ea043' || (steps.spec.outputs.spec-pct >= 80 && 'd29922' || '9f9f9f') }}
          path: ".github/badges/specification.svg"

      # Committed from a WORKTREE, so this checkout is never disturbed. Switching the branch in
      # place replaces the working tree with one that has no action.yml in it — and the
      # composite action's own post step then cannot find itself and fails the job AFTER the
      # badge was already written and pushed. A green measurement reported as a red X.
      - name: Push badges to the badges branch
        if: github.ref == 'refs/heads/main'
        # Step outputs reach the script through env, never spliced into it: a `${{ }}` inside
        # `run:` becomes shell code before bash reads it.
        env:
          SPEC_PCT: ${{ steps.spec.outputs.spec-pct }}
          DIMS_PINNED: ${{ steps.spec.outputs.dimensions-pinned }}
          DIMS_TOTAL: ${{ steps.spec.outputs.dimensions-total }}
        run: |
          cp .github/badges/*.svg /tmp/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges
            git worktree add /tmp/badges-wt badges
          else
            git worktree add --detach /tmp/badges-wt
            git -C /tmp/badges-wt checkout --orphan badges
            git -C /tmp/badges-wt rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p /tmp/badges-wt/.github/badges
          cp /tmp/*.svg /tmp/badges-wt/.github/badges/
          cd /tmp/badges-wt
          git add .github/badges/*.svg

          if git diff --cached --quiet; then
            echo "No badge changes"
            exit 0
          fi

          git commit -m "spec ${SPEC_PCT}% (${DIMS_PINNED}/${DIMS_TOTAL} dimensions pinned)"
          git push origin badges
