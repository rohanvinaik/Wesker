[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Wesker"
# ONE owner: `Wesker/__init__.py`. Not a style choice — 0.6.0 shipped to PyPI with
# `Wesker.__version__ == '0.5.1'`, because the number lived here AND there and only this copy
# got bumped. A version that disagrees with itself is the same one-fact-two-homes drift this
# release removes from the cache layer.
dynamic = ["version"]
description = "In-process AST mutation testing for Python. Zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rohan Vinaik" }]
keywords = ["mutation-testing", "testing", "ast", "code-quality", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
wesker = "Wesker.cli:main"

[project.urls]
Homepage = "https://github.com/rohanvinaik/Wesker"
Repository = "https://github.com/rohanvinaik/Wesker"

# The engine core is zero-dependency by design. pytest is a STATED OPTIONAL extra: the
# preferred test-discovery path uses pytest's own collection (robust across parametrize /
# fixtures / conftest — the conventions real projects use); without it the engine degrades
# to a legacy unittest loader. `pip install Wesker[pytest]` opts into the preferred path.
[project.optional-dependencies]
pytest = ["pytest>=7"]

[dependency-groups]
# ruff pinned so CI's `ruff format --check` gate cannot drift on a newer release.
dev = ["pytest>=7", "pytest-cov>=4", "ruff==0.16.7"]

# Wesker profiles its own library core. CLI/entry/orchestration modules
# (cli, __main__, __init__, metrics) are excluded — they are thin dispatch,
# matching the coverage exclusions below.
[tool.hatch.version]
path = "Wesker/__init__.py"

# The packaging boundary, made explicit. Hatchling excludes VCS-ignored files by default, so the
# .gitignore entries are the root guard — but a PUBLISHED sdist must never carry local tool state, and
# `.lintgate/` was riding along (737 files, some with absolute /Users/... paths) because it was the one
# dot-tool dir not yet ignored. This second guard states the intent at the boundary itself: an artifact
# that slips back into an un-ignored state still cannot ship. Regeneratable session state, never source.
#
# CORRECTED 2026-09-09 — "Hatchling excludes VCS-ignored files by default" is true only of the ROOT
# `.gitignore`. A NESTED one is invisible to it: measured with a minimal probe project, a rule in
# `nested/deep/.gitignore` was ignored and its target shipped, while the equivalent root rule held.
# Detective hit this for real, packaging 6.9 GB of Lean build output that `git status` never showed.
# So the sentence above states a guarantee over a subspace without saying it is one, which is why
# the list below is the contract and `scripts/check_sdist.py` — which fails on any sdist member git
# does not track — is what actually enforces it. Wesker has no nested .gitignore today; that is a
# fact about the tree, not a property of the build, and it is the reason to check rather than not.
[tool.hatch.build]
exclude = [
    # Agent-instruction files carry absolute /Users/... paths and local agent-memory references —
    # a machine-identity leak in a published sdist (same class as the .lintgate leak noted above).
    "AGENTS.md",
    "CLAUDE.md",
    ".lintgate",
    ".detective",
    ".wesker",
    ".serena",
    ".prism",
    ".claude",
]

[tool.wesker]
source_dir = "Wesker"
exclude = [
    "Wesker/cli.py",
    "Wesker/__main__.py",
    "Wesker/__init__.py",
    "Wesker/metrics.py",
]

[tool.coverage.run]
source = ["Wesker"]
omit = [
    "Wesker/cli.py",
    "Wesker/__main__.py",
    "Wesker/__init__.py",
    "Wesker/metrics.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["detective: test generated by Detective"]

# No `select`: Wesker lints under ruff's default rule set, pinned by the dev-group version above.
[tool.ruff]
# Markdown is prose. ruff >= 0.16 formats the Python blocks inside `.md` files, which re-flows
# the column-aligned comments in docs/usage.md.
extend-exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# N999: `Wesker` is the product's name, imported as `Wesker` by every consumer; its casing is part
# of that identity, so the package cannot take PEP 8's lowercase module name.
"Wesker/__init__.py" = ["N999"]
"Wesker/__main__.py" = ["N999"]

# Point the type checker at the venv Wesker actually runs in, so its dependencies resolve and
# the annotations below are checked against real signatures rather than Unknown.
[tool.pyright]
venvPath = "."
venv = ".venv"

# ── pylint as the SonarCloud approximation (pre-push discipline; global CLAUDE.md) ─────────────
# Tuned to MATCH Sonar's ruleset, not pylint's stricter defaults: S103's 200-column line, and the
# pylint-only rules Sonar does not share or that fight the documented house style. The residue is
# genuine (a broad except without a stated reason, real complexity) and gets fixed, not exempted.
# Run: uvx pylint <package>   — reproducible from this config, never hand-cleared per session.
[tool.pylint.format]
max-line-length = 200

[tool.pylint."messages control"]
disable = [
    "C0114", "C0115", "C0116",  # missing docstrings — present where they matter
    "C0103",                    # invalid-name — deliberate short math/domain names
    "W1514",                    # unspecified-encoding — not a SonarPython default; runtime is UTF-8
    "R0801",                    # duplicate-code — Sonar measures duplication its own way
    "R0902", "R0903", "R0911", "R0913", "R0914", "R0917",  # too-many-* — intentional record builders
    "C0415",                    # import-outside-toplevel — deliberate lazy / cycle-avoiding imports
    "W0621",                    # redefined-outer-name — CLI shadow patterns
]
